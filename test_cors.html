<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Report CORS Test</title>
    <style>
        body { font-family: system-ui; padding: 20px; max-width: 800px; margin: 0 auto; }
        .test { padding: 15px; margin: 10px 0; border-radius: 8px; border: 2px solid #ccc; }
        .pass { background: #d1fae5; border-color: #10b981; }
        .fail { background: #fee2e2; border-color: #ef4444; }
        .pending { background: #fef3c7; border-color: #f59e0b; }
        button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #2563eb; }
        pre { background: #f3f4f6; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
        .status { font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <h1>Market Report API — CORS Test</h1>
    <p>This test verifies the market report endpoint is working and CORS headers are properly configured.</p>
    
    <button onclick="runTest()">Run Test</button>
    
    <div id="results"></div>

    <script>
        async function runTest() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="test pending"><span class="status">⏳ Testing...</span></div>';

            const testResults = [];

            // Test 1: Health Check
            try {
                const healthResp = await fetch('http://localhost:8000/api/v1/health');
                const healthOk = healthResp.ok;
                testResults.push({
                    name: 'Health Endpoint',
                    pass: healthOk,
                    details: `Status: ${healthResp.status}`,
                });
            } catch (e) {
                testResults.push({
                    name: 'Health Endpoint',
                    pass: false,
                    details: `Error: ${e.message}`,
                });
            }

            // Test 2: Market Report (No Dataset)
            try {
                const reportResp = await fetch('http://localhost:8000/api/v1/market-report?top_n=10', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({}),
                });
                
                const reportData = await reportResp.json();
                const isExpectedResponse = reportResp.status === 200 && reportData.message;
                
                testResults.push({
                    name: 'Market Report Endpoint',
                    pass: isExpectedResponse,
                    details: `Status: ${reportResp.status}<br>Message: ${reportData.message || 'N/A'}<br>Success: ${reportData.success}`,
                });
            } catch (e) {
                const isCorsError = e.message.includes('CORS') || e.message.includes('fetch');
                testResults.push({
                    name: 'Market Report Endpoint',
                    pass: false,
                    details: `Error: ${e.message}<br>${isCorsError ? '❌ CORS ERROR DETECTED' : ''}`,
                });
            }

            // Test 3: Status Endpoint
            try {
                const statusResp = await fetch('http://localhost:8000/api/v1/status');
                const statusData = await statusResp.json();
                const hasDatasets = statusData.data && statusData.data.datasets;
                
                testResults.push({
                    name: 'Status Endpoint',
                    pass: statusResp.ok && hasDatasets,
                    details: `Status: ${statusResp.status}<br>Datasets: ${JSON.stringify(statusData.data?.datasets || {})}`,
                });
            } catch (e) {
                testResults.push({
                    name: 'Status Endpoint',
                    pass: false,
                    details: `Error: ${e.message}`,
                });
            }

            // Render Results
            const allPassed = testResults.every(t => t.pass);
            
            let html = '<h2>Test Results</h2>';
            testResults.forEach(test => {
                const className = test.pass ? 'pass' : 'fail';
                const icon = test.pass ? '✅' : '❌';
                html += `
                    <div class="test ${className}">
                        <span class="status">${icon} ${test.name}</span>
                        <div style="margin-top: 10px; font-size: 14px;">${test.details}</div>
                    </div>
                `;
            });

            html += '<h2>Summary</h2>';
            if (allPassed) {
                html += `
                    <div class="test pass">
                        <span class="status">✅ ALL TESTS PASSED</span>
                        <div style="margin-top: 10px;">
                            ✓ Backend is running<br>
                            ✓ Market report endpoint returns proper response<br>
                            ✓ CORS headers are configured correctly<br>
                            ✓ No CORS errors detected
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="test fail">
                        <span class="status">❌ SOME TESTS FAILED</span>
                        <div style="margin-top: 10px;">
                            Review the failures above. Common issues:<br>
                            • Backend not running → Start: python -m uvicorn app.main:app --reload<br>
                            • CORS error → Check main.py has port 5174 in allowed origins<br>
                            • 500 error → Check backend terminal for traceback
                        </div>
                    </div>
                `;
            }

            resultsDiv.innerHTML = html;
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            setTimeout(runTest, 500);
        });
    </script>
</body>
</html>
